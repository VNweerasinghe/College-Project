<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>College Project Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
      <div class="container">
        <a class="navbar-brand" href="index.html">College Project Management</a>
        <div class="ms-auto">
          <a class="btn btn-outline-light btn-sm me-2" href="login.html">Login</a>
          <a class="btn btn-light btn-sm" href="register.html">Register</a>
        </div>
      </div>
    </nav>

    <main class="container py-5">
      <div class="row justify-content-center">
        <div class="col-lg-8">
          <div class="card hero-card p-4 p-md-5">
            <h1 class="display-6 fw-bold mb-3">College Project Management System</h1>
            <p class="lead text-muted mb-4">
              A simple system for students to submit, manage, and track academic projects.
            </p>
            <div class="d-flex flex-wrap gap-2">
              <a class="btn btn-primary" href="login.html">Login</a>
              <a class="btn btn-outline-primary" href="register.html">Create Account</a>
              <a class="btn btn-success" href="dashboard.html" id="dashboardButton" style="display: none;">Go to Dashboard</a>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        const dashboardButton = document.getElementById('dashboardButton');
        if (isLoggedIn()) {
          dashboardButton.style.display = 'inline-block';
        }
      });
    </script>
  </body>
</html>
