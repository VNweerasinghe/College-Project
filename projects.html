<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Projects | College Project Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
      <div class="container">
        <a class="navbar-brand" href="dashboard.html">College Project Management</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav me-auto">
            <li class="nav-item"><a class="nav-link" href="dashboard.html">Dashboard</a></li>
            <li class="nav-item"><a class="nav-link active" href="projects.html">Projects</a></li>
            <li class="nav-item"><a class="nav-link" href="submit-project.html">Submit Project</a></li>
            <li class="nav-item" id="manageProjectsLink"><a class="nav-link" href="admin-projects.html">Manage Projects</a></li>
          </ul>
          <span class="navbar-text text-white me-3" id="navUserName"></span>
          <a class="btn btn-outline-light btn-sm" href="#" id="logoutLink">Logout</a>
        </div>
      </div>
    </nav>

    <main class="container py-4">
      <div id="alertContainer"></div>
      <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
          <h2 class="page-title" id="projectsPageTitle">My Projects</h2>
          <p class="text-muted mb-0" id="projectsPageSubtitle">View and manage your submitted projects.</p>
        </div>
        <a class="btn btn-primary" href="submit-project.html">Submit New Project</a>
      </div>

      <div class="card p-3 mb-4">
        <label for="statusFilter" class="form-label">Filter by status</label>
        <select class="form-select w-auto" id="statusFilter">
          <option value="all">All</option>
          <option value="Draft">Draft</option>
          <option value="Active">Active</option>
          <option value="Completed">Completed</option>
        </select>
      </div>

      <div id="projectsContent">
        <div class="text-muted">Loading projects...</div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/projects.js"></script>
  </body>
</html>
