<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard | College Project Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
      <div class="container">
        <a class="navbar-brand" href="dashboard.html">College Project Management</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav me-auto">
            <li class="nav-item"><a class="nav-link active" href="dashboard.html">Dashboard</a></li>
            <li class="nav-item"><a class="nav-link" href="projects.html">Projects</a></li>
            <li class="nav-item"><a class="nav-link" href="submit-project.html">Submit Project</a></li>
            <li class="nav-item" id="manageProjectsLink"><a class="nav-link" href="admin-projects.html">Manage Projects</a></li>
          </ul>
          <span class="navbar-text text-white me-3" id="navUserName"></span>
          <a class="btn btn-outline-light btn-sm" href="#" id="logoutLink">Logout</a>
        </div>
      </div>
    </nav>

    <main class="container py-4">
      <div id="alertContainer"></div>
      <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
          <h2 class="page-title">Dashboard</h2>
          <p class="text-muted mb-0" id="welcomeMessage">Loading...</p>
        </div>
        <a class="btn btn-primary" href="submit-project.html">Submit New Project</a>
      </div>

      <div class="row g-4 mb-4" id="statsContainer">
        <div class="col-md-4">
          <div class="card p-3">
            <h5>Total Projects</h5>
            <p class="display-6 mb-0" id="totalProjects">0</p>
          </div>
        </div>
        <div class="col-md-4">
          <div class="card p-3">
            <h5>Active Projects</h5>
            <p class="display-6 mb-0" id="activeProjects">0</p>
          </div>
        </div>
        <div class="col-md-4">
          <div class="card p-3">
            <h5>Draft Projects</h5>
            <p class="display-6 mb-0" id="draftProjects">0</p>
          </div>
        </div>
      </div>

      <div class="card p-4">
        <h4 class="mb-3">Recent Activity</h4>
        <p class="text-muted">Use the navigation above to submit or review your project work.</p>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/dashboard.js"></script>
  </body>
</html>
