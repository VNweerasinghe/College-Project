<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Submit Project | College Project Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
      <div class="container">
        <a class="navbar-brand" href="dashboard.html">College Project Management</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav me-auto">
            <li class="nav-item"><a class="nav-link" href="dashboard.html">Dashboard</a></li>
            <li class="nav-item"><a class="nav-link" href="projects.html">Projects</a></li>
            <li class="nav-item"><a class="nav-link active" href="submit-project.html">Submit Project</a></li>
            <li class="nav-item" id="manageProjectsLink"><a class="nav-link" href="admin-projects.html">Manage Projects</a></li>
          </ul>
          <span class="navbar-text text-white me-3" id="navUserName"></span>
          <a class="btn btn-outline-light btn-sm" href="#" id="logoutLink">Logout</a>
        </div>
      </div>
    </nav>

    <main class="container py-4">
      <div id="alertContainer"></div>
      <h2 class="page-title">Submit a New Project</h2>
      <form id="projectForm" class="needs-validation" novalidate>
        <div class="form-section">
          <h4>Student Information</h4>
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label">Student Name</label>
              <input type="text" class="form-control" id="studentName" required />
            </div>
            <div class="col-md-6">
              <label class="form-label">Contact Number</label>
              <input type="text" class="form-control" id="contactNo" required />
            </div>
            <div class="col-md-6">
              <label class="form-label">Email</label>
              <input type="email" class="form-control" id="emailId" required />
            </div>
          </div>
        </div>

        <div class="form-section">
          <h4>Project Information</h4>
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label">Project Title</label>
              <input type="text" class="form-control" id="projectTitle" required />
            </div>
            <div class="col-md-6">
              <label class="form-label">Department</label>
              <input type="text" class="form-control" id="department" required />
            </div>
            <div class="col-md-6">
              <label class="form-label">Course</label>
              <input type="text" class="form-control" id="course" required />
            </div>
            <div class="col-md-6">
              <label class="form-label">Technologies Used</label>
              <input type="text" class="form-control" id="technologies" required />
            </div>
            <div class="col-12">
              <label class="form-label">Project Description</label>
              <textarea class="form-control" id="projectDescription" rows="4"></textarea>
            </div>
          </div>
        </div>

        <div class="form-section">
          <h4>Project Dates</h4>
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label">Start Date</label>
              <input type="date" class="form-control" id="startDate" required />
            </div>
            <div class="col-md-6">
              <label class="form-label">End Date</label>
              <input type="date" class="form-control" id="endDate" required />
            </div>
          </div>
        </div>

        <div class="form-section">
          <h4>Project Type</h4>
          <div class="form-check mb-2">
            <input class="form-check-input" type="radio" name="projectType" id="individualProject" value="false" checked />
            <label class="form-check-label" for="individualProject">Individual Project</label>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="radio" name="projectType" id="groupProject" value="true" />
            <label class="form-check-label" for="groupProject">Group Project</label>
          </div>
          <div class="mt-3" id="groupMembersContainer" style="display: none;">
            <label class="form-label">Group Members</label>
            <textarea class="form-control" id="groupMembers" rows="3"></textarea>
          </div>
        </div>

        <div class="form-section">
          <h4>Synopsis and Links</h4>
          <div class="form-check mb-3">
            <input class="form-check-input" type="checkbox" id="isSynopsisSubmitted" />
            <label class="form-check-label" for="isSynopsisSubmitted">Synopsis Submitted</label>
          </div>
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label">GitHub URL</label>
              <input type="url" class="form-control" id="gitHubUrl" />
            </div>
            <div class="col-md-6">
              <label class="form-label">Live Demo URL</label>
              <input type="url" class="form-control" id="liveUrl" />
            </div>
          </div>
        </div>

        <div class="form-section">
          <h4>Status</h4>
          <select class="form-select" id="status">
            <option value="Draft">Draft</option>
            <option value="Active">Active</option>
            <option value="Completed">Completed</option>
          </select>
        </div>

        <button type="submit" class="btn btn-primary" id="submitButton">Submit Project</button>
      </form>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/submit-project.js"></script>
  </body>
</html>
